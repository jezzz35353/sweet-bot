<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sweet Bot</title><style>:root{--bg:#0f1115;--card:#171a21;--text:#e6e8ee;--muted:#9aa3b2;--accent:#ff6b9a;--line:#262a33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:48px 22px 80px}
header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#ff6b9a,#ffb36b);display:grid;place-items:center;font-weight:800;color:#1a0f14}
.brand{font-weight:700;font-size:18px}
h1{font-size:32px;line-height:1.2;margin:0 0 6px}
.date{color:var(--muted);font-size:14px;margin-bottom:28px}
h2{font-size:19px;margin:34px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
p,li{color:#cfd4de}
ul{padding-left:20px}
a{color:var(--accent)}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:15px}
